name: CI - Run Unit Tests

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v2

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'

      # Install dependencies
      - name: Install dependencies
        run: |
          cd frontend
          npm install

      # Run unit tests
      - name: Run Unit Tests
        run: |
          cd frontend
          npm run test:unit
